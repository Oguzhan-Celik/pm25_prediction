# Training Configuration

# Data parameters
data:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  batch_size: 32
  num_workers: 4
  pin_memory: true

# Training parameters
training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 1e-5
  gradient_clip: 1.0
  early_stopping:
    patience: 10
    min_delta: 1e-4

# Optimizer parameters
optimizer:
  type: "adam" # Options: adam, sgd, rmsprop
  beta1: 0.9
  beta2: 0.999
  momentum: 0.9 # For SGD

# Learning rate scheduler
scheduler:
  type: "reduce_on_plateau" # Options: reduce_on_plateau, cosine, step
  factor: 0.5
  patience: 5
  min_lr: 1e-6
  warmup_epochs: 5

# Loss function parameters
loss:
  type: "physics_guided" # Options: mse, mae, physics_guided
  physics_weight: 0.1
  mae_weight: 0.5
  mse_weight: 0.4

# Logging and checkpointing
logging:
  log_interval: 100
  save_interval: 5
  tensorboard: true
  wandb: false # Weights & Biases integration

# Model checkpointing
checkpoint:
  save_best: true
  save_last: true
  max_keep: 5
