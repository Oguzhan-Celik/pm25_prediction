# Improved Model Architecture Configuration

# Input dimensions (corrected to match actual data)
input_features: 43
num_stations: 12
sequence_length: 24
forecast_horizon: 72

# ConvLSTM parameters
conv_lstm:
  hidden_dims: 64 # Increased from 64
  kernel_size: 3
  num_layers: 2 # Increased from 1
  dropout_rate: 0.3 # Increased from 0.2

# Graph Attention parameters
gat:
  hidden_dims: 64 # Increased from 64
  num_heads: 8 # Increased from 4
  num_layers: 3 # Increased from 2
  dropout_rate: 0.3 # Increased from 0.2
  alpha: 0.2

# Multi-scale residual block parameters
residual:
  num_blocks: 4 # Increased from 3
  hidden_dims: [32, 64, 128] # Increased from [32, 64, 128]
  kernel_sizes: [3, 5, 7]

# Output layer parameters
output:
  hidden_dims: 64 # Increased from 32
  dropout_rate: 0.2 # Increased from 0.1

# Model Architecture
model:
  time_steps: 24
  num_stations: 12
  input_features: 43 # Corrected to actual value
  forecast_horizon: 72
  hidden_dims: 128 # Increased from 64
  num_heads: 4 # Reduced from 8 for efficiency
  num_layers: 2 # Balanced complexity
  dropout_rate: 0.15 # Reduced from 0.3
  use_stca_features: true # Re-enable for better performance
  use_wavelet_denoising: true # Re-enable for noise reduction

# Wavelet Parameters
wavelet:
  wavelet_type: "db4"
  level: 3 # Increased from 2

# Training Parameters
training:
  batch_size: 128 # Increased for better gradient estimates
  epochs: 50 # Reduced from excessive epochs
  learning_rate: 0.002 # Increased for faster convergence
  min_lr: 1e-5 # Higher minimum
  patience: 3 # Reduced patience for faster adaptation
  min_delta: 0.0005 # Adjusted threshold
  validation_split: 0.2
  grad_clip: 0.5 # Reduced for more aggressive updates
  weight_decay: 0.0001 # Reduced regularization
  num_workers: 4

  # New scheduler configuration
  scheduler:
    type: "cosine" # Better than plateau for this task
    T_0: 10
    T_mult: 2

# Data Parameters
data:
  data_dir: "data/processed/"
  output_dir: "models/improved"
  sequence_length: 24
  station_names:
    [
      "Aotizhongxin",
      "Changping",
      "Dingling",
      "Dongsi",
      "Guanyuan",
      "Gucheng",
      "Huairou",
      "Nongzhanguan",
      "Shunyi",
      "Tiantan",
      "Wanliu",
      "Wanshouxigong",
    ]
  prefetch_factor: 2 # For faster data loading
  pin_memory: true # For GPU acceleration

# Loss Function Parameters
loss:
  lambda_phys: 0.0 # Increased from 0.3
  lambda_wavelet: 0.0 # Increased from 0.15
  lambda_attention: 0.0 # Increased from 0.15
  lambda_reg: 0.001 # Single regularization parameter
  lambda_consistency: 0.05 # Multi-step consistency

# Evaluation Metrics
metrics:
  - mae
  - rmse
  - mape
  - r2

# Performance Optimizations
performance:
  mixed_precision: true # Enable for 2x speed improvement
  compile_model: true # PyTorch 2.0 compilation
  channels_last: true # Memory layout optimization
